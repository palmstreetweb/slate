<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Slate — stack drop motion</title>
<style>
  :root {
    --bg:#121418; --panel:#1c2128; --ink:#f3efe6; --muted:#8b93a0;
    --line:#313842; --red:#e23b2d; --on:#fff;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
    --spring: cubic-bezier(0.34, 1.45, 0.64, 1);
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 var(--sans); }
  .banner {
    position:sticky; top:0; z-index:6; padding:14px 22px;
    background:rgb(18 20 24 / .92); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line); font-weight:650;
  }
  .wrap { max-width:1080px; margin:0 auto; padding:28px 20px 80px; }
  h1 { margin:0 0 6px; font-size:28px; letter-spacing:-.03em; }
  .lead { margin:0 0 22px; color:var(--muted); max-width:68ch; }
  .grid { display:grid; grid-template-columns:1fr; gap:18px; }
  .opt { background:#0e1014; border:1px solid var(--line); border-radius:18px; padding:14px; }
  .head { display:flex; justify-content:space-between; gap:12px; align-items:center; margin-bottom:10px; }
  .n {
    width:26px; height:26px; border-radius:8px; display:grid; place-items:center;
    background:#232931; border:1px solid var(--line); font:700 12px/1 var(--sans); color:var(--muted);
  }
  h2 { margin:0; font-size:16px; letter-spacing:-.02em; }
  .why { margin:3px 0 0; color:var(--muted); font-size:12px; }
  button.pick {
    appearance:none; border:0; cursor:pointer; height:32px; padding:0 12px; border-radius:999px;
    background:var(--red); color:#fff; font:650 12px/1 var(--sans);
  }
  button.pick.is-on { background:#fff; color:#111; }
  .stage {
    position:relative; height:300px; border-radius:14px; overflow:hidden;
    background:var(--red); color:var(--on);
    display:grid; place-items:center;
  }
  .copy { text-align:center; padding:20px; }
  .copy b { display:block; margin-top:18px; font-size:22px; letter-spacing:-.03em; }
  .stack { display:flex; flex-direction:column; align-items:center; gap:8px; }
  .bar {
    display:block; height:10px; border-radius:99px; background:#fff;
    transform-origin:center;
  }
  .bar:nth-child(1) { width:22px; }
  .bar:nth-child(2) { width:42px; }
  .bar:nth-child(3) { width:30px; }

  /* 1 Assemble — same language as the converting loader */
  .m1 .bar {
    transform-origin: left center;
    animation: assemble 0.9s var(--ease) infinite;
    opacity: 0;
  }
  .m1 .bar:nth-child(1) { animation-delay: 0s; }
  .m1 .bar:nth-child(2) { animation-delay: .12s; }
  .m1 .bar:nth-child(3) { animation-delay: .24s; }
  .m1 b { animation: label-in .6s var(--ease) both; }
  @keyframes assemble {
    0% { opacity:0; transform:scaleX(.2); }
    25%, 70% { opacity:1; transform:scaleX(1); }
    100% { opacity:0; transform:scaleX(1); }
  }

  /* 2 Catch — bars fall in with a spring, like grabbing the file */
  .m2 .bar {
    animation: catch 1.4s var(--spring) infinite;
  }
  .m2 .bar:nth-child(1) { animation-delay: 0s; }
  .m2 .bar:nth-child(2) { animation-delay: .08s; }
  .m2 .bar:nth-child(3) { animation-delay: .16s; }
  .m2 b { animation: label-in .5s var(--ease) .2s both; }
  @keyframes catch {
    0% { opacity:0; transform:translateY(-42px) scale(.7); }
    38% { opacity:1; transform:translateY(4px) scale(1.06); }
    55% { transform:translateY(0) scale(1); }
    100% { opacity:1; transform:translateY(0) scale(1); }
  }

  /* 3 Wave — waiting equalizer, file is over the page */
  .m3 .bar {
    transform-origin: center;
    animation: wave .9s ease-in-out infinite;
  }
  .m3 .bar:nth-child(1) { animation-delay: 0s; }
  .m3 .bar:nth-child(2) { animation-delay: .12s; }
  .m3 .bar:nth-child(3) { animation-delay: .24s; }
  @keyframes wave {
    0%, 100% { transform:scaleX(.55); opacity:.55; }
    50% { transform:scaleX(1.15); opacity:1; }
  }

  /* 4 Bloom — the red fills from a point, then the stack lands */
  .m4 { animation: bloom-fill 2.2s var(--ease) infinite; }
  .m4 .stack { animation: bloom-stack 2.2s var(--spring) infinite; }
  .m4 b { animation: bloom-label 2.2s var(--ease) infinite; }
  @keyframes bloom-fill {
    0% { clip-path: circle(0% at 50% 50%); }
    28%, 78% { clip-path: circle(140% at 50% 50%); }
    100% { clip-path: circle(140% at 50% 50%); }
  }
  @keyframes bloom-stack {
    0%, 22% { opacity:0; transform:scale(.6); }
    40% { opacity:1; transform:scale(1.08); }
    52%, 82% { opacity:1; transform:scale(1); }
    100% { opacity:0; transform:scale(1); }
  }
  @keyframes bloom-label {
    0%, 28% { opacity:0; transform:translateY(8px); }
    48%, 82% { opacity:1; transform:translateY(0); }
    100% { opacity:0; }
  }

  /* 5 Breathe — stack is already there, slow inhale while you hold the file */
  .m5 .stack { animation: breathe 1.8s ease-in-out infinite; }
  .m5 b { animation: label-in .5s var(--ease) both; opacity:.92; }
  @keyframes breathe {
    0%, 100% { transform:scale(.92); opacity:.78; }
    50% { transform:scale(1); opacity:1; }
  }

  @keyframes label-in {
    from { opacity:0; transform:translateY(6px); }
    to { opacity:1; transform:translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .bar, .stack, b, .m4 { animation: none !important; opacity: 1 !important; transform: none !important; clip-path: none !important; }
  }
</style>
</head>
<body>
  <div class="banner" id="banner">Stack is locked. Pick a motion. Reply with the number.</div>
  <div class="wrap">
    <h1>How the stack moves while you hold the file</h1>
    <p class="lead">Same red page, same three bars, five rhythms. They loop so you can sit with them. Choose one.</p>
    <div class="grid" id="grid"></div>
  </div>
<script>
const OPTIONS = [
  { id:1, name:'Assemble', why:'The converting loader, just on red. Bars grow in from the left, then fade.' },
  { id:2, name:'Catch', why:'Bars drop in with a spring. Feels like the page grabbed the PDF.' },
  { id:3, name:'Wave', why:'Equalizer pulse. The stack is waiting, still listening.' },
  { id:4, name:'Bloom', why:'Red opens from the center. Then the stack pops in.' },
  { id:5, name:'Breathe', why:'Nothing busy. The whole stack inhales while you hold the file.' },
];

const chosen = new Set();
const grid = document.getElementById('grid');
const banner = document.getElementById('banner');

function paint() {
  grid.innerHTML = OPTIONS.map((opt) => `
    <article class="opt" data-id="${opt.id}">
      <div class="head">
        <div style="display:flex;gap:10px;align-items:center">
          <div class="n">${opt.id}</div>
          <div><h2>${opt.name}</h2><p class="why">${opt.why}</p></div>
        </div>
        <button class="pick${chosen.has(opt.id) ? ' is-on' : ''}" type="button" data-pick="${opt.id}">${chosen.has(opt.id) ? 'Chosen' : 'Choose'}</button>
      </div>
      <div class="stage m${opt.id}">
        <div class="copy">
          <div class="stack">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
          </div>
          <b>Drop to convert</b>
        </div>
      </div>
    </article>
  `).join('');
  const ids = [...chosen];
  banner.textContent = ids.length
    ? `You picked ${ids[0]}. Reply with that number.`
    : 'Stack is locked. Pick a motion. Reply with the number.';
}

grid.addEventListener('click', (e) => {
  const pick = e.target.closest('[data-pick]');
  if (!pick) return;
  chosen.clear();
  chosen.add(Number(pick.dataset.pick));
  paint();
});
paint();
</script>
</body>
</html>
